  </div>
  <article class="card">
    <h2 style="font-size:17px;font-weight:750;margin:2px 0 12px">衰老速度</h2>
    <div class="age-row"><p class="metric-value c-green">-0.2<span class="unit">x</span></p><span class="badge green"><i class="icon xs" data-icon="leaf"></i> 加速年轻中</span></div>
    <div class="gradient-bar" style="margin:14px 0 0"><span class="marker" style="left:29%"></span></div>
    <div class="scale-labels"><span>-1x</span><span>1x</span><span>3x</span></div>

    <div class="card-foot" style="grid-template-columns:1fr"><button type="button" data-go="ai-chat">问问AI</button></div>

  <article class="card">
    <h2 style="font-size:17px;font-weight:750;margin:2px 0 10px">影响因素</h2>
    <button type="button" class="list-row" data-sheet="age-factor"><i class="icon c-purple" data-icon="moon"></i><span class="row-main"><span class="row-title">睡眠时长</span></span><span class="row-value orange">+0.2岁</span><i class="icon chev" data-icon="chevron-right"></i></button>
    <button type="button" class="list-row" data-sheet="age-factor"><i class="icon c-purple" data-icon="clock"></i><span class="row-main"><span class="row-title">睡眠一致性</span></span><span class="row-value green">-1.1岁</span><i class="icon chev" data-icon="chevron-right"></i></button>
    <button type="button" class="list-row" data-sheet="age-factor"><i class="icon c-purple" data-icon="bike"></i><span class="row-main"><span class="row-title">Z1-Z3训练时长/周</span></span><span class="row-value orange">+0.5岁</span><i class="icon chev" data-icon="chevron-right"></i></button>
    <button type="button" class="list-row" data-sheet="age-factor"><i class="icon c-pink" data-icon="run"></i><span class="row-main"><span class="row-title">Z4-Z5训练时长/周</span></span><span class="row-value orange">+0.4岁</span><i class="icon chev" data-icon="chevron-right"></i></button>
    <button type="button" class="list-row" data-sheet="age-factor"><i class="icon c-pink" data-icon="weights"></i><span class="row-main"><span class="row-title">力量训练时长/周</span></span><span class="row-value orange">+0.8岁</span><i class="icon chev" data-icon="chevron-right"></i></button>
    <button type="button" class="list-row" data-sheet="age-factor"><i class="icon c-green" data-icon="steps"></i><span class="row-main"><span class="row-title">步数</span></span><span class="row-value orange">+0.3岁</span><i class="icon chev" data-icon="chevron-right"></i></button>
    <button type="button" class="list-row" data-sheet="age-factor"><i class="icon c-orange" data-icon="vo2"></i><span class="row-main"><span class="row-title">最大摄氧量</span></span><span class="row-value orange">+4.4岁</span><i class="icon chev" data-icon="chevron-right"></i></button>
    <button type="button" class="list-row" data-sheet="age-factor"><i class="icon c-green" data-icon="heart"></i><span class="row-main"><span class="row-title">静息心率</span></span><span class="row-value orange">+0.5岁</span><i class="icon chev" data-icon="chevron-right"></i></button>
    <button type="button" class="list-row" data-sheet="age-factor"><i class="icon c-orange" data-icon="gauge"></i><span class="row-main"><span class="row-title">体脂率</span></span><span class="row-value orange">+0.1岁</span><i class="icon chev" data-icon="chevron-right"></i></button>
  </article>
